name: BUILD ROM
on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API (29 or 30)'
        default: '30'
permissions: write-all
jobs:
  rom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tools
        run: |
          set +e
          sudo apt-get update -qq 2>&1 | tee rom.log
          sudo apt-get install -y -qq xz-utils e2fsprogs cpio zip unzip 2>&1 | tee -a rom.log
          echo "APT_EXIT=$?" | tee -a rom.log

      - name: SDK + system image + mkbootimg
        run: |
          set +e
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo c.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q c.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" "build-tools;35.0.0" "platform-tools" 2>&1 | tee -a $GITHUB_WORKSPACE/rom.log
          echo "BT_EXIT=$?" >> $GITHUB_WORKSPACE/rom.log
          for pkg in "system-images;android-${{ inputs.api }};default;arm64-v8a" \
                     "system-images;android-${{ inputs.api }};google_apis;arm64-v8a" \
                     "system-images;android-${{ inputs.api }};aosp_atd;arm64-v8a"; do
            echo "trying $pkg" >> $GITHUB_WORKSPACE/rom.log
            cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" "$pkg" >> $GITHUB_WORKSPACE/rom.log 2>&1 && { echo "OK $pkg" >> $GITHUB_WORKSPACE/rom.log; break; }
          done
          echo "SDK=$SDK" >> $GITHUB_ENV

      - name: Collect parts
        run: |
          set +e
          IMG=$(find "$SDK/system-images" -name "system.img" | head -1)
          echo "IMG=$IMG" | tee -a rom.log
          [ -z "$IMG" ] && { echo "NO SYSTEM IMAGE FOUND" | tee -a rom.log; exit 1; }
          DIR=$(dirname "$IMG"); ls -lh "$DIR" | tee -a rom.log
          mkdir -p work out
          cp "$IMG" work/system.img
          cp "$DIR/vendor.img" work/ 2>/dev/null
          cp "$DIR/ramdisk.img" work/ 2>/dev/null
          cp "$DIR/kernel-ranchu-64" work/kernel 2>/dev/null || cp "$DIR/kernel-ranchu" work/kernel 2>/dev/null
          cp "$DIR/kernel-qemu" work/kernel 2>/dev/null
          ls -lh work/ | tee -a rom.log

      - name: Tune system.img
        run: |
          set +e
          cd work
          if file system.img | grep -qi sparse; then simg2img system.img raw.img && mv raw.img system.img; fi
          truncate -s +256M system.img
          e2fsck -fy system.img > /dev/null 2>&1
          resize2fs system.img > /dev/null 2>&1
          mkdir -p mnt
          sudo mount -o loop,rw system.img mnt || { echo "MOUNT FAILED" | tee -a ../rom.log; exit 1; }
          sudo tee -a mnt/system/build.prop > /dev/null <<'EOF'

          # HASEEB GAMING tuning
          ro.haseeb.rom=gaming
          ro.debuggable=0
          ro.secure=1
          ro.build.tags=release-keys
          windowsmgr.max_events_per_sec=150
          ro.min_pointer_dur=8
          ro.max.fling_velocity=20000
          ro.config.low_ram=false
          persist.sys.ui.hw=1
          EOF
          for d in BasicDreams Camera2 DocumentsUI Email Exchange2 PrintSpooler Traceur LiveWallpapers WallpaperPicker Gallery2 Music QuickSearchBox; do
            sudo rm -rf "mnt/system/app/$d" "mnt/system/priv-app/$d"
          done
          echo "haseeb-gaming" | sudo tee mnt/system/etc/haseeb_rom > /dev/null
          sudo umount mnt
          ls -lh system.img | tee -a ../rom.log

      - name: boot.img
        run: |
          set +e
          cd work
          MK=$(find "$SDK/build-tools" -name mkbootimg | head -1)
          echo "mkbootimg=$MK" | tee -a ../rom.log
          if [ -n "$MK" ] && [ -f kernel ] && [ -f ramdisk.img ]; then
            "$MK" --kernel kernel --ramdisk ramdisk.img \
              --cmdline "console=ttyAMA0 androidboot.hardware=virt androidboot.selinux=permissive" \
              --pagesize 4096 --output boot.img 2>&1 | tee -a ../rom.log
          else
            echo "BOOTIMG SKIPPED (mk=$MK kernel=$(ls kernel 2>/dev/null) ramdisk=$(ls ramdisk.img 2>/dev/null))" | tee -a ../rom.log
          fi

      - name: Package
        run: |
          set +e
          cd work
          sha256sum *.img kernel 2>/dev/null > ../out/sha256.txt
          cd ..
          ZIP=HaseebGaming-API${{ inputs.api }}-arm64.zip
          zip -r9 "$ZIP" out work/system.img work/vendor.img work/ramdisk.img work/kernel work/boot.img 2>&1 | tail -3
          ls -lh "$ZIP" | tee -a rom.log

      - name: Save log
        if: always()
        run: |
          git config user.name ci-bot; git config user.email ci-bot@users.noreply.github.com
          git add -A; git commit -m "rom log [skip ci]" || true
          git pull --rebase --autostash || true; git push || true

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rom-${{ github.run_number }}
          name: HASEEB GAMING ROM ${{ github.run_number }}
          files: HaseebGaming-*.zip
          prerelease: true
