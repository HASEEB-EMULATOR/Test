name: Fix build and compile engine
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply fixes
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py 2>&1 | tee -a ci.log
          echo "fix step exit: $?"

      - name: Android SDK + NDK + CMake
        run: |
          set +e
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip 2>&1 | tee -a "$GITHUB_WORKSPACE/ci.log"
          unzip -q clt.zip -d cmdline-tools 2>&1 | tee -a "$GITHUB_WORKSPACE/ci.log"
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" 2>&1 | tee -a "$GITHUB_WORKSPACE/ci.log"
          echo "sdk step exit: $?"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          cd "$GITHUB_WORKSPACE"
          echo "sdk.dir=$SDK" > local.properties

      - name: Gradle
        run: |
          set +e
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip 2>&1 | tee -a ci.log
          unzip -q gradle.zip 2>&1 | tee -a ci.log
          echo "gradle step exit: $?"
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          rc=$?
          echo "gradle exit: $rc"
          if [ $rc -ne 0 ]; then
            grep -nE "(^|: )e: |error:|FAILURE:|What went wrong|CMake Error|undefined reference|not found" build.log | grep -v "note:" | head -30 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null

      - name: Report
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          {
            echo "run: $GITHUB_RUN_ID  status: ${{ job.status }}"
            echo "=== ci.log (last 120) ==="
            tail -120 ci.log 2>/dev/null || echo "(no ci.log)"
            echo
            echo "=== build.log errors ==="
            grep -nE "(^|: )e: |error:|FAILURE:|What went wrong|CMake Error|undefined reference" build.log 2>/dev/null | grep -v "note:" | head -40 || echo "(no build.log)"
            echo
            echo "=== build.log tail ==="
            tail -60 build.log 2>/dev/null || echo "(no build.log)"
          } > build-error.txt
          git add -f build-error.txt ci.log 2>/dev/null || true
          git add -A || true
          git commit -m "ci report [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true

      - name: Publish APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HASEEB GAMING ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
