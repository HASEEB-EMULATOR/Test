name: BUILD APK
on: workflow_dispatch
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix build files
        run: |
          python3 - <<'PY'
          import re
          p="gradle/libs.versions.toml"; s=open(p).read()
          s=re.sub(r'^agp = ".*"$','agp = "8.7.3"',s,flags=re.M)
          s=re.sub(r'^kotlin = ".*"$','kotlin = "2.0.21"',s,flags=re.M)
          s=re.sub(r'^googleDevtoolsKsp = ".*"$','googleDevtoolsKsp = "2.0.21-1.0.28"',s,flags=re.M)
          s=re.sub(r'^coreKtx = ".*"$','coreKtx = "1.13.1"',s,flags=re.M)
          s=re.sub(r'^activityCompose = ".*"$','activityCompose = "1.9.3"',s,flags=re.M)
          open(p,"w").write(s)

          p="build.gradle.kts"; s=open(p).read()
          s="\n".join(l for l in s.split("\n") if "libs.plugins.secrets" not in l and "libs.plugins.google.services" not in l)
          open(p,"w").write(s)

          p="app/build.gradle.kts"; s=open(p).read()
          s="\n".join(l for l in s.split("\n") if "alias(libs.plugins.secrets)" not in l and "alias(libs.plugins.google.services)" not in l and "MissingGoogleServicesStrategy" not in l)
          s=re.sub(r'compileSdk \{ version = release\((\d+)\) \{ minorApiLevel = \d+ \} \}', r'compileSdk = \1', s)
          s=s.replace("compileSdk = 36","compileSdk = 35")
          if "ndkVersion" not in s: s=s.replace("compileSdk = 35",'compileSdk = 35\n  ndkVersion = "27.0.12077973"')
          s=re.sub(r'\nsecrets \{[^}]*\}\n','\n',s)
          s=re.sub(r'\ngoogleServices \{[^}]*\}\n','\n',s)
          s=re.sub(r'\n// Configure the Secrets Gradle Plugin[^\n]*\n// to match the convention used in Web projects\.\n','\n',s)
          open(p,"w").write(s)

          p="app/src/main/cpp/CMakeLists.txt"; s=open(p).read()
          for f in ["prop_area.cpp","property_service.cpp","elf64_loader.cpp"]:
              if "src/"+f not in s:
                  s=s.replace("    src/ext4_reader.cpp\n","    src/ext4_reader.cpp\n    src/"+f+"\n",1)
          open(p,"w").write(s)

          p="gradle.properties"; s=open(p).read()
          s=s.replace("org.gradle.configuration-cache=true","org.gradle.configuration-cache=false")
          if "android.useAndroidX" not in s: s=s.rstrip()+"\nandroid.useAndroidX=true\n"
          if "android.enableJetifier" not in s: s=s.rstrip()+"\nandroid.enableJetifier=true\n"
          if "org.gradle.configuration-cache" not in s: s=s.rstrip()+"\norg.gradle.configuration-cache=false\n"
          open(p,"w").write(s)
          print("fixed")
          PY

      - name: SDK
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo c.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q c.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          cd "$GITHUB_WORKSPACE"; echo "sdk.dir=$SDK" > local.properties

      - name: Gradle
        run: |
          curl -sSLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          gradle --no-daemon assembleDebug 2>&1 | tee build-full.log | tail -50
          exit ${PIPESTATUS[0]}

      - name: Save log
        if: always()
        run: |
          git config user.name ci-bot; git config user.email ci-bot@users.noreply.github.com
          git add -A; git commit -m "build log [skip ci]" || true
          git pull --rebase --autostash || true; git push || true

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HASEEB GAMING ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
