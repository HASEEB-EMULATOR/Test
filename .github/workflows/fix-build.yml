name: Fix build and compile engine
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply fixes
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py

      - name: Android SDK + NDK + CMake
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q clt.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties

      - name: Gradle
        run: |
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          set +e
          gradle --no-daemon assembleDebug > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -nE "(^|: )e: |error:|FAILURE:|What went wrong|CMake Error|undefined reference" build.log | grep -v "note:" | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            { echo "run: $GITHUB_RUN_ID"; echo "=== errors ==="; grep -nE "(^|: )e: |error:|FAILURE:|What went wrong|CMake Error|undefined reference" build.log | grep -v "note:" | head -40; echo "=== tail ==="; tail -60 build.log; } > build-error.txt
            git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
            git add -A; git commit -m "build fixes + error log [skip ci]" || true
            git pull --rebase --autostash || true; git push || true
            exit $rc
          fi
          ls -lh app/build/outputs/apk/debug/

      - name: Commit fixes and publish APK
        if: success()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -m "build fixes [skip ci]" || true; git push || true

      - name: Publish APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HASEEB GAMING ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
