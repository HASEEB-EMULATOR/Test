name: BUILD APK
on: workflow_dispatch
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write the corrected build files
        run: |
          echo '' | base64 -d > /tmp/w.py
          python3 /tmp/w.py

      - name: Android SDK
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q clt.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          cd "$GITHUB_WORKSPACE"
          echo "sdk.dir=$SDK" > local.properties

      - name: Gradle
        run: |
          curl -sSLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug 2>&1 | tee /tmp/build.log | tail -60
          exit ${PIPESTATUS[0]}

      - name: Save log and publish
        if: always()
        run: |
          cp /tmp/build.log build-full.log || true
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add -A; git commit -m "build: log + fixed files [skip ci]" || true
          git pull --rebase --autostash || true; git push || true

      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HASEEB GAMING ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
