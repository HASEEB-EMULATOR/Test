name: BUILD ROM
on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API (29=Android10, 30=Android11)'
        default: '30'
permissions: write-all
jobs:
  rom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils e2fsprogs android-sdk-libsparse-utils \
            android-sdk-build-tools-common mkbootimg cpio gzip unzip

      - name: Download the arm64 system image
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo c.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q c.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" "system-images;android-${{ inputs.api }};default;arm64-v8a"
          echo "SDK=$SDK" >> $GITHUB_ENV

      - name: Collect parts
        run: |
          set -e
          IMG=$(find "$SDK/system-images" -path "*arm64-v8a*" -name "system.img" | head -1)
          DIR=$(dirname "$IMG")
          echo "image dir: $DIR"
          ls -lh "$DIR"
          mkdir -p work out
          cp "$IMG" work/system.img
          cp "$DIR/vendor.img" work/vendor.img 2>/dev/null || true
          cp "$DIR/ramdisk.img" work/ramdisk.img 2>/dev/null || true
          cp "$DIR/kernel-ranchu-64" work/kernel 2>/dev/null || cp "$DIR/kernel-ranchu" work/kernel 2>/dev/null || true
          ls -lh work/

      - name: Tune the system image
        run: |
          set -e
          cd work
          if file system.img | grep -qi sparse; then simg2img system.img raw.img; mv raw.img system.img; fi
          truncate -s +256M system.img
          e2fsck -fy system.img || true
          resize2fs system.img || true
          mkdir -p mnt
          sudo mount -o loop,rw system.img mnt
          sudo tee -a mnt/system/build.prop > /dev/null <<'EOF'

          # HASEEB GAMING tuning
          ro.haseeb.rom=gaming
          ro.haseeb.version=1.0
          ro.debuggable=0
          ro.secure=1
          ro.build.tags=release-keys
          debug.hwui.render_draft_quality=0
          windowsmgr.max_events_per_sec=150
          ro.min_pointer_dur=8
          ro.max.fling_velocity=20000
          ro.min.fling_velocity=8000
          ro.config.low_ram=false
          persist.sys.ui.hw=1
          EOF
          for d in BasicDreams Camera2 DocumentsUI Email Exchange2 PrintSpooler Traceur \
                   LiveWallpapers WallpaperPicker Gallery2 Music QuickSearchBox; do
            sudo rm -rf "mnt/system/app/$d" "mnt/system/priv-app/$d" || true
          done
          echo "haseeb-gaming" | sudo tee mnt/system/etc/haseeb_rom > /dev/null
          sudo umount mnt
          ls -lh system.img

      - name: Build boot.img
        run: |
          set -e
          cd work
          if [ -f kernel ] && [ -f ramdisk.img ]; then
            mkbootimg --kernel kernel --ramdisk ramdisk.img \
              --cmdline "console=ttyAMA0 androidboot.hardware=ranchu androidboot.selinux=permissive" \
              --pagesize 4096 --output boot.img || echo "mkbootimg not available"
          fi
          ls -lh

      - name: Package + manifest
        run: |
          set -e
          cd work
          sha256sum system.img > ../out/sha256.txt
          [ -f boot.img ] && sha256sum boot.img >> ../out/sha256.txt
          [ -f vendor.img ] && sha256sum vendor.img >> ../out/sha256.txt
          [ -f ramdisk.img ] && sha256sum ramdisk.img >> ../out/sha256.txt
          cat > ../out/manifest.json <<EOF
          {
            "name": "HaseebGaming-API${{ inputs.api }}-arm64",
            "api": ${{ inputs.api }},
            "arch": "arm64",
            "parts": ["system.img","boot.img","vendor.img","ramdisk.img"],
            "sha256": "$(sha256sum system.img | cut -d' ' -f1)"
          }
          EOF
          cd ..
          zip -r9 HaseebGaming-API${{ inputs.api }}-arm64.zip out/ work/system.img work/boot.img work/vendor.img work/ramdisk.img 2>/dev/null || \
            zip -r9 HaseebGaming-API${{ inputs.api }}-arm64.zip out/ work/system.img
          ls -lh *.zip

      - name: Publish ROM
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rom-${{ github.run_number }}
          name: HASEEB GAMING ROM ${{ github.run_number }}
          files: HaseebGaming-*.zip
          prerelease: true
